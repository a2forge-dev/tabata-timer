<!DOCTYPE html>
<html lang="ja">

<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>タバタタイマー</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            background: #d32f2f;
            transition: .3s;
        }

        body.rest {
            background: #1976d2;
        }

        body.finish {
            background: #2e7d32;
        }

        #phase {
            font-size: 40px;
        }

        #timer {
            font-size: 120px;
            font-weight: bold;
        }

        #setInfo {
            font-size: 24px;
            margin-bottom: 20px;
        }

        button {
            font-size: 24px;
            padding: 15px 30px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <div id="setInfo">セット 1 / 8</div>

    <div id="phase">運動</div>

    <div id="timer">20</div>

    <div>
        <button onclick="startTimer()">開始</button>
        <button onclick="resetTimer()">リセット</button>
    </div>

    <script>

        let workTime = 20;
        let restTime = 10;
        let totalSets = 8;

        let currentSet = 1;
        let currentTime = workTime;
        let isWork = true;
        let timerId = null;

        function beep(freq, duration) {

            const ctx =
                new (window.AudioContext ||
                    window.webkitAudioContext)();

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.frequency.value = freq;

            osc.connect(gain);
            gain.connect(ctx.destination);

            gain.gain.value = 0.2;

            osc.start();

            osc.stop(
                ctx.currentTime +
                duration / 1000
            );
        }

        async function startTimer() {

            if (timerId) return;

            if ('wakeLock' in navigator) {

                try {
                    await navigator.wakeLock.request('screen');
                } catch (e) { }
            }

            timerId = setInterval(() => {

                currentTime--;

                document.getElementById("timer")
                    .textContent = currentTime;

                if (
                    currentTime === 15 ||
                    currentTime === 14 ||
                    currentTime === 13
                ) {
                    beep(1200, 100);
                }

                if (currentTime <= 0) {

                    beep(700, 500);

                    if (isWork) {

                        isWork = false;
                        currentTime = restTime;

                        document.body.className = "rest";

                        document.getElementById("phase")
                            .textContent = "休憩";

                    } else {

                        currentSet++;

                        if (currentSet > totalSets) {

                            clearInterval(timerId);

                            document.body.className = "finish";

                            document.getElementById("phase")
                                .textContent = "終了";

                            document.getElementById("timer")
                                .textContent = "0";

                            return;
                        }

                        isWork = true;
                        currentTime = workTime;

                        document.body.className = "";

                        document.getElementById("phase")
                            .textContent = "運動";

                        document.getElementById("setInfo")
                            .textContent =
                            `セット ${currentSet} / ${totalSets}`;
                    }

                    document.getElementById("timer")
                        .textContent = currentTime;
                }

            }, 1000);
        }

        function resetTimer() {

            clearInterval(timerId);

            timerId = null;

            currentSet = 1;
            currentTime = workTime;
            isWork = true;

            document.body.className = "";

            document.getElementById("phase")
                .textContent = "運動";

            document.getElementById("timer")
                .textContent = workTime;

            document.getElementById("setInfo")
                .textContent = "セット 1 / 8";
        }

    </script>

</body>

</html>
