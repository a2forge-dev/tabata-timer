<!DOCTYPE html>
<html lang="ja">

<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>タバタタイマー</title>

    <style>
        body {
            margin: 0;
            font-family: 'Yu Gothic', 'Meiryo', 'Segoe UI', Arial, sans-serif;
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            color: rgb(255, 0, 0);
            background: #000;
            transition: .3s;
        }

        body.rest {
            background: #000;
        }

        body.finish {
            background: #000;
        }

        #phase {
            font-size: 40px;
        }

        #timer {
            font-family: 'Segoe UI', 'Yu Gothic', 'Meiryo', sans-serif;
            font-size: 240px;
            font-weight: bold;
            letter-spacing: normal;
        }

        #setInfo {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .settings {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .settings label {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 16px;
            color: white;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .settings input,
        .settings select {
            width: 90px;
            padding: 6px 8px;
            margin-top: 4px;
            font-size: 16px;
            border-radius: 4px;
            border: none;
            text-align: right;
        }

        button {
            font-size: 24px;
            padding: 15px 30px;
            margin: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }

        .hidden {
            display: none;
        }

        .music-panel {
            width: min(760px, calc(100vw - 32px));
            margin-top: 12px;
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            color: white;
        }

        .music-header,
        .music-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .music-toolbar {
            margin-top: 12px;
        }

        .music-status {
            margin-top: 8px;
            font-size: 14px;
            opacity: 0.9;
        }

        .music-playlist {
            list-style: none;
            margin: 12px 0 0;
            padding: 0;
            max-height: 180px;
            overflow-y: auto;
        }

        .music-playlist li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 6px;
            font-size: 14px;
        }

        .music-playlist li.current-track,
        .music-playlist li.selected-track {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .music-track-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: left;
            background: transparent;
            border: none;
            color: white;
            font: inherit;
            cursor: pointer;
            padding: 0;
        }

        .music-delete-button {
            font-size: 14px;
            padding: 8px 12px;
            margin: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        .music-small-button {
            font-size: 16px;
            padding: 10px 16px;
            margin: 0;
        }

        .status-message {
            min-height: 22px;
            margin-top: 8px;
            font-size: 14px;
            color: #ffdede;
        }

        .status-message.error {
            color: #ffb4b4;
        }

        @media (max-width: 640px) {
            #timer {
                font-size: 150px;
            }

            button {
                font-size: 20px;
                padding: 12px 22px;
            }

            .music-panel {
                width: calc(100vw - 20px);
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="settingsScreen" class="screen">
        <div class="settings">
            <label>
                運動時間
                <div>
                    <input id="workMinutesInput" type="number" min="0" step="1" value="0" style="width:60px;"> 分
                    <input id="workSecondsInput" type="number" min="0" max="59" step="1" value="20" style="width:60px;">
                    秒
                </div>
            </label>
            <label>
                休憩時間
                <div>
                    <input id="restMinutesInput" type="number" min="0" step="1" value="0" style="width:60px;"> 分
                    <input id="restSecondsInput" type="number" min="0" max="59" step="1" value="10" style="width:60px;">
                    秒
                </div>
            </label>
            <label>
                セット数
                <input id="totalSetsInput" type="number" min="1" step="1" value="8">
            </label>
            <label>
                開始余裕時間
                <div>
                    <input id="startGraceSecondsInput" type="number" min="0" max="300" step="1" value="3" style="width:60px;">
                    秒
                </div>
            </label>
        </div>

        <div id="musicPanel" class="music-panel">
            <div class="music-header">
                <strong>音楽プレイヤー</strong>
                <div class="music-toolbar">
                    <button id="musicToggleButton" type="button" class="music-small-button">再生</button>
                    <label>
                        <span>再生方式</span>
                        <select id="musicModeSelect">
                            <option value="sequence">順番再生</option>
                            <option value="random">ランダム再生</option>
                        </select>
                    </label>
                </div>
            </div>
            <div id="musicStatus" class="music-status">音楽未登録（0曲）</div>
            <div class="music-toolbar">
                <input id="musicFileInput" type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,.mp4,.webm,audio/*" multiple hidden>
                <button id="musicAddButton" type="button" class="music-small-button">音楽を追加</button>
            </div>
            <ul id="musicPlaylist" class="music-playlist"></ul>
            <div id="statusMessage" class="status-message" aria-live="polite"></div>
        </div>

        <div class="controls">
            <button id="startButton" onclick="startTimer()">開始</button>
        </div>
    </div>

    <div id="timerScreen" class="screen hidden">
        <div id="setInfo">セット 1 / 8</div>

        <div id="phase">運動</div>

        <div id="timer">20</div>

        <div class="controls">
            <button id="pauseButton" onclick="togglePause()">一時停止</button>
            <button id="timerMusicToggleButton" type="button" class="music-small-button">音楽再生</button>
            <button id="timerResetButton" class="hidden" onclick="resetTimer()">リセット</button>
        </div>
    </div>

    <script>
        const MUSIC_DB_NAME = 'tabataTimerMusicDb';
        const MUSIC_DB_VERSION = 1;
        const SUPPORTED_MUSIC_TYPES = [
            'audio/mpeg',
            'audio/mp3',
            'audio/wav',
            'audio/x-wav',
            'audio/ogg',
            'audio/aac',
            'audio/m4a',
            'audio/mp4',
            'audio/webm'
        ];
        const SUPPORTED_MUSIC_EXTENSIONS = ['.mp3', '.wav', '.m4a', '.aac', '.ogg', '.mp4', '.webm'];

        let workTime = 20;
        let restTime = 10;
        let totalSets = 8;
        let startGraceTime = 3;

        let currentSet = 1;
        let currentTime = workTime;
        let isWork = true;
        let timerId = null;
        let isPaused = false;
        let timerPhase = 'initial';
        let graceUsedInCurrentSession = false;

        let musicDb = null;
        let musicTracks = [];
        let musicPlayMode = 'sequence';
        let musicAudio = null;
        let musicCurrentIndex = -1;
        let musicSelectedIndex = 0;
        let lastRandomIndex = -1;
        let musicIsPlaying = false;
        let currentMusicObjectUrl = '';

        function showStatus(message, isError = false) {
            const element = document.getElementById('statusMessage');
            if (!element) return;
            element.textContent = message;
            element.classList.toggle('error', isError);
            if (message) {
                clearTimeout(showStatus.timeoutId);
                showStatus.timeoutId = setTimeout(() => {
                    element.textContent = '';
                    element.classList.remove('error');
                }, 4000);
            }
        }

        function playSound(path) {
            const audio = new Audio(path);
            audio.play().catch(() => {
                // ignore playback errors on some browsers
            });
        }

        function showSettingsScreen() {
            document.getElementById("settingsScreen").classList.remove("hidden");
            document.getElementById("timerScreen").classList.add("hidden");
            document.getElementById("timerResetButton").classList.add("hidden");
            document.getElementById("pauseButton").textContent = "一時停止";
            document.getElementById("pauseButton").classList.remove("hidden");
        }

        function showTimerScreen() {
            document.getElementById("settingsScreen").classList.add("hidden");
            document.getElementById("timerScreen").classList.remove("hidden");
        }

        function updateTimerDisplay() {
            const phaseElement = document.getElementById('phase');
            const timerElement = document.getElementById('timer');
            const setElement = document.getElementById('setInfo');

            if (timerPhase === 'ready') {
                phaseElement.textContent = '開始前';
            } else if (timerPhase === 'work') {
                phaseElement.textContent = '運動';
            } else if (timerPhase === 'rest') {
                phaseElement.textContent = '休憩';
            } else if (timerPhase === 'finished') {
                phaseElement.textContent = '終了';
            } else {
                phaseElement.textContent = '運動';
            }

            timerElement.textContent = formatTime(currentTime);
            setElement.textContent = `セット ${currentSet} / ${totalSets}`;
        }

        function selectTrack(index) {
            if (!musicTracks[index]) return;
            musicSelectedIndex = index;
            updateMusicDisplay();
        }

        function updateMusicDisplay() {
            const musicStatus = document.getElementById('musicStatus');
            const button = document.getElementById('musicToggleButton');
            const timerButton = document.getElementById('timerMusicToggleButton');
            const list = document.getElementById('musicPlaylist');

            if (!musicStatus || !button || !list) return;

            musicIsPlaying = Boolean(musicAudio && !musicAudio.paused && musicAudio.src);
            musicStatus.textContent = `音楽登録数（${musicTracks.length}曲）`;
            button.textContent = musicIsPlaying ? '一時停止' : '再生';
            if (timerButton) {
                timerButton.textContent = musicIsPlaying ? '音楽停止' : '音楽再生';
            }

            list.innerHTML = '';

            if (!musicTracks.length) {
                const emptyItem = document.createElement('li');
                emptyItem.textContent = '音楽が未登録です';
                list.appendChild(emptyItem);
                return;
            }

            musicTracks.forEach((track, index) => {
                const item = document.createElement('li');
                if (index === musicCurrentIndex) {
                    item.classList.add('current-track');
                }
                if (index === musicSelectedIndex) {
                    item.classList.add('selected-track');
                }

                const nameButton = document.createElement('button');
                nameButton.type = 'button';
                nameButton.className = 'music-track-name';
                nameButton.textContent = track.name;
                nameButton.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    selectTrack(index);
                });

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'music-delete-button';
                deleteButton.textContent = '削除';
                deleteButton.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    musicController.removeTrack(track.id);
                });

                item.appendChild(nameButton);
                item.appendChild(deleteButton);
                list.appendChild(item);
            });
        }

        function setBodyClassForPhase() {
            if (timerPhase === 'rest') {
                document.body.className = 'rest';
            } else if (timerPhase === 'finished') {
                document.body.className = 'finish';
            } else {
                document.body.className = '';
            }
        }

        function beginWorkPhase() {
            currentSet = Math.max(1, currentSet);
            timerPhase = 'work';
            isWork = true;
            currentTime = workTime;
            setBodyClassForPhase();
            updateTimerDisplay();
        }

        function beginRestPhase() {
            timerPhase = 'rest';
            isWork = false;
            currentTime = restTime;
            setBodyClassForPhase();
            updateTimerDisplay();
        }

        function finishTimer() {
            clearInterval(timerId);
            timerId = null;
            isPaused = false;
            timerPhase = 'finished';
            document.getElementById("pauseButton").classList.add("hidden");
            document.getElementById("timerResetButton").classList.remove("hidden");
            document.getElementById("timerResetButton").textContent = 'リセット';
            document.body.className = 'finish';
            currentTime = 0;
            updateTimerDisplay();
            musicController.stopPlayback();
        }

        function togglePause() {
            if (timerPhase === 'finished' || timerPhase === 'initial') return;
            if (timerId) {
                pauseTimer();
            } else {
                resumeTimer();
            }
        }

        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
            isPaused = true;
            document.getElementById("pauseButton").textContent = "再開";
            document.getElementById("timerResetButton").classList.remove("hidden");
        }

        function resumeTimer() {
            if (timerId) return;
            isPaused = false;
            document.getElementById("pauseButton").textContent = "一時停止";
            document.getElementById("timerResetButton").classList.add("hidden");
            startInterval();
        }

        async function startTimer() {
            if (timerId) return;

            applySettings();
            showTimerScreen();
            document.getElementById("pauseButton").textContent = "一時停止";
            document.getElementById("timerResetButton").classList.add("hidden");
            document.getElementById("pauseButton").classList.remove("hidden");
            isPaused = false;

            currentSet = 1;
            isWork = true;

            if (startGraceTime > 0 && !graceUsedInCurrentSession) {
                timerPhase = 'ready';
                currentTime = startGraceTime;
                graceUsedInCurrentSession = true;
            } else {
                beginWorkPhase();
            }

            setBodyClassForPhase();
            updateTimerDisplay();
            musicController.requestPlayOnTimerStart();
            startInterval();
        }

        function startInterval() {
            if (timerId) return;

            if ('wakeLock' in navigator) {
                try {
                    navigator.wakeLock.request('screen').catch(() => {});
                } catch (e) {
                    // ignore wake lock issues
                }
            }

            timerId = setInterval(() => {
                if (currentTime > 0) {
                    currentTime--;
                }

                if (timerPhase === 'ready') {
                    if (currentTime <= 0) {
                        playSound('audio/Buzzer_long.mp3');
                        beginWorkPhase();
                        return;
                    }
                } else if (timerPhase === 'work' || timerPhase === 'rest') {
                    if (currentTime === 15 && timerPhase !== 'ready') {
                        playSound('audio/Buzzer_short_double.mp3');
                    }

                    if (currentTime <= 0) {
                        playSound('audio/Buzzer_long.mp3');

                        if (timerPhase === 'work') {
                            beginRestPhase();
                            return;
                        }

                        if (timerPhase === 'rest') {
                            currentSet += 1;
                            if (currentSet > totalSets) {
                                finishTimer();
                                return;
                            }
                            beginWorkPhase();
                            return;
                        }
                    }
                }

                updateTimerDisplay();
            }, 1000);
        }

        function applySettings() {
            const workMin = parseInt(document.getElementById("workMinutesInput").value, 10);
            const workSec = parseInt(document.getElementById("workSecondsInput").value, 10);
            const restMin = parseInt(document.getElementById("restMinutesInput").value, 10);
            const restSec = parseInt(document.getElementById("restSecondsInput").value, 10);
            const newSets = parseInt(document.getElementById("totalSetsInput").value, 10);
            const graceSec = parseInt(document.getElementById("startGraceSecondsInput").value, 10);

            if (Number.isNaN(workMin) || workMin < 0) return;
            if (Number.isNaN(workSec) || workSec < 0 || workSec > 59) return;
            if (Number.isNaN(restMin) || restMin < 0) return;
            if (Number.isNaN(restSec) || restSec < 0 || restSec > 59) return;
            if (Number.isNaN(newSets) || newSets < 1) return;
            if (Number.isNaN(graceSec) || graceSec < 0 || graceSec > 300) return;

            workTime = workMin * 60 + workSec;
            restTime = restMin * 60 + restSec;
            totalSets = newSets;
            startGraceTime = graceSec;

            currentSet = 1;
            currentTime = workTime;
            isWork = true;
            timerPhase = 'initial';

            document.getElementById("phase").textContent = "運動";
            document.getElementById("timer").textContent = formatTime(workTime);
            document.getElementById("setInfo").textContent = `セット ${currentSet} / ${totalSets}`;
        }

        function formatTime(seconds) {
            if (seconds < 60) {
                return String(seconds);
            }
            const minutes = Math.floor(seconds / 60);
            const sec = seconds % 60;
            return `${minutes}:${sec.toString().padStart(2, '0')}`;
        }

        function resetTimer() {
            const shouldStopMusic = timerPhase !== 'initial' && timerPhase !== 'finished' && !isPaused;

            clearInterval(timerId);
            timerId = null;
            isPaused = false;
            document.getElementById("timerResetButton").classList.add("hidden");
            document.getElementById("pauseButton").classList.remove("hidden");
            showSettingsScreen();
            document.getElementById("startButton").textContent = "開始";

            if (shouldStopMusic) {
                musicController.stopPlayback();
            }

            currentSet = 1;
            currentTime = workTime;
            isWork = true;
            timerPhase = 'initial';
            graceUsedInCurrentSession = false;

            document.body.className = '';
            document.getElementById("phase").textContent = "運動";
            document.getElementById("timer").textContent = formatTime(workTime);
            document.getElementById("setInfo").textContent = `セット ${currentSet} / ${totalSets}`;
        }

        document.getElementById("workMinutesInput").addEventListener("change", applySettings);
        document.getElementById("workSecondsInput").addEventListener("change", applySettings);
        document.getElementById("restMinutesInput").addEventListener("change", applySettings);
        document.getElementById("restSecondsInput").addEventListener("change", applySettings);
        document.getElementById("totalSetsInput").addEventListener("change", applySettings);
        document.getElementById("startGraceSecondsInput").addEventListener("change", applySettings);

        function isSupportedMusicFile(file) {
            const extension = file.name.toLowerCase().slice(file.name.lastIndexOf('.'));
            const type = file.type ? file.type.toLowerCase() : '';
            return SUPPORTED_MUSIC_TYPES.includes(type) || SUPPORTED_MUSIC_EXTENSIONS.includes(extension);
        }

        function generateTrackId() {
            const cryptoObject = window.crypto || window.msCrypto;
            if (cryptoObject && cryptoObject.randomUUID) {
                return cryptoObject.randomUUID();
            }
            return `track-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        function openMusicDatabase() {
            return new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) {
                    reject(new Error('このブラウザはIndexedDBに対応していません。'));
                    return;
                }

                const request = indexedDB.open(MUSIC_DB_NAME, MUSIC_DB_VERSION);

                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains('tracks')) {
                        db.createObjectStore('tracks', { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains('settings')) {
                        db.createObjectStore('settings', { keyPath: 'key' });
                    }
                };

                request.onsuccess = () => {
                    musicDb = request.result;
                    resolve();
                };

                request.onerror = () => {
                    reject(request.error || new Error('IndexedDBの開始に失敗しました。'));
                };
            });
        }

        function storeMusicSettings(key, value) {
            return new Promise((resolve, reject) => {
                if (!musicDb) {
                    resolve();
                    return;
                }

                const transaction = musicDb.transaction('settings', 'readwrite');
                const store = transaction.objectStore('settings');
                const request = store.put({ key, value });
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error || new Error('再生方式の保存に失敗しました。'));
            });
        }

        function loadMusicSettings() {
            return new Promise((resolve, reject) => {
                if (!musicDb) {
                    resolve(null);
                    return;
                }

                const transaction = musicDb.transaction('settings', 'readonly');
                const store = transaction.objectStore('settings');
                const request = store.get('playMode');
                request.onsuccess = () => resolve(request.result ? request.result.value : null);
                request.onerror = () => reject(request.error || new Error('再生方式の読込に失敗しました。'));
            });
        }

        function loadSavedTracks() {
            return new Promise((resolve, reject) => {
                if (!musicDb) {
                    resolve([]);
                    return;
                }

                const transaction = musicDb.transaction('tracks', 'readonly');
                const store = transaction.objectStore('tracks');
                const request = store.getAll();
                request.onsuccess = () => {
                    const tracks = (request.result || []).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
                    musicTracks = tracks;
                    if (!musicTracks.length) {
                        musicSelectedIndex = 0;
                    } else if (musicSelectedIndex >= musicTracks.length) {
                        musicSelectedIndex = 0;
                    }
                    resolve(tracks);
                };
                request.onerror = () => reject(request.error || new Error('保存済み音楽の読込に失敗しました。'));
            });
        }

        function saveTracksToDatabase(tracks) {
            return new Promise((resolve, reject) => {
                if (!musicDb) {
                    resolve();
                    return;
                }

                const transaction = musicDb.transaction('tracks', 'readwrite');
                const store = transaction.objectStore('tracks');

                tracks.forEach((track) => store.put(track));

                transaction.oncomplete = () => resolve();
                transaction.onerror = () => reject(transaction.error || new Error('音楽の保存に失敗しました。'));
            });
        }

        function deleteTrackFromDatabase(trackId) {
            return new Promise((resolve, reject) => {
                if (!musicDb) {
                    resolve();
                    return;
                }

                const transaction = musicDb.transaction('tracks', 'readwrite');
                const store = transaction.objectStore('tracks');
                const request = store.delete(trackId);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error || new Error('音楽の削除に失敗しました。'));
            });
        }

        function getTrackUrl(track) {
            return new Promise((resolve, reject) => {
                if (track.objectUrl && track.objectUrl.startsWith('blob:')) {
                    resolve(track.objectUrl);
                    return;
                }

                if (track.file instanceof Blob) {
                    const objectUrl = URL.createObjectURL(track.file);
                    resolve(objectUrl);
                    return;
                }

                if (track.data instanceof ArrayBuffer) {
                    const blob = new Blob([track.data], { type: track.mimeType || track.type || 'audio/*' });
                    const objectUrl = URL.createObjectURL(blob);
                    resolve(objectUrl);
                    return;
                }

                if (track.url) {
                    resolve(track.url);
                    return;
                }

                reject(new Error('音楽データを取得できませんでした。再登録してください。'));
            });
        }

        const musicController = {
            currentIndex: -1,

            ensureAudio() {
                if (!musicAudio) {
                    musicAudio = new Audio();
                    musicAudio.preload = 'auto';
                    musicAudio.volume = 0.8;
                    musicAudio.addEventListener('ended', () => {
                        this.advanceToNextTrack();
                    });
                    musicAudio.addEventListener('error', () => {
                        showStatus('音楽の再生に失敗しました。音源を再登録してください。', true);
                        this.stopPlayback();
                    });
                }
                return musicAudio;
            },

            async initialize() {
                try {
                    await openMusicDatabase();
                    const savedPlayMode = await loadMusicSettings();
                    if (savedPlayMode === 'random' || savedPlayMode === 'sequence') {
                        musicPlayMode = savedPlayMode;
                    }
                    document.getElementById('musicModeSelect').value = musicPlayMode;
                    await loadSavedTracks();
                    updateMusicDisplay();
                } catch (error) {
                    showStatus(error.message || '音楽の保存機能を利用できません。', true);
                }
            },

            async requestPlayOnTimerStart() {
                if (!musicTracks.length) return;
                this.ensureAudio();

                const startIndex = musicSelectedIndex;
                if (this.currentIndex === -1) {
                    if (startIndex >= 0 && startIndex < musicTracks.length) {
                        await this.playTrackAtIndex(startIndex);
                    }
                    return;
                }

                if (musicAudio.paused) {
                    try {
                        await musicAudio.play();
                        musicIsPlaying = true;
                        updateMusicDisplay();
                    } catch (error) {
                        showStatus('音楽の再生に失敗しました。音源を再登録してください。', true);
                    }
                }
            },

            async togglePlayback() {
                this.ensureAudio();

                if (!musicTracks.length) {
                    showStatus('音楽ファイルが未登録です。追加してください。', true);
                    return;
                }

                if (musicAudio.paused) {
                    const nextIndex = this.currentIndex === -1 ? musicSelectedIndex : this.currentIndex;
                    if (this.currentIndex === -1) {
                        await this.playTrackAtIndex(nextIndex);
                        return;
                    }

                    try {
                        await musicAudio.play();
                        musicIsPlaying = true;
                        updateMusicDisplay();
                    } catch (error) {
                        const message = (error && error.name === 'NotAllowedError')
                            ? 'ブラウザが自動再生をブロックしました。再生ボタンをもう一度押してください。'
                            : '再生に失敗しました。音源を再登録してください。';
                        showStatus(message, true);
                    }
                    return;
                }

                musicAudio.pause();
                musicIsPlaying = false;
                updateMusicDisplay();
            },

            async playTrackAtIndex(index) {
                if (!musicTracks[index]) return;
                this.ensureAudio();

                try {
                    const track = musicTracks[index];
                    const objectUrl = await getTrackUrl(track);
                    if (currentMusicObjectUrl && currentMusicObjectUrl.startsWith('blob:')) {
                        URL.revokeObjectURL(currentMusicObjectUrl);
                    }
                    currentMusicObjectUrl = objectUrl;
                    track.objectUrl = objectUrl;
                    musicAudio.src = objectUrl;
                    musicAudio.load();
                    await musicAudio.play();
                    musicCurrentIndex = index;
                    this.currentIndex = index;
                    musicSelectedIndex = index;
                    musicIsPlaying = true;
                    updateMusicDisplay();
                } catch (error) {
                    const message = (error && error.name === 'NotAllowedError')
                        ? 'ブラウザが自動再生をブロックしました。再生ボタンをもう一度押してください。'
                        : (error && error.message) || '音楽データを取得できませんでした。再登録してください。';
                    showStatus(message, true);
                    this.stopPlayback();
                }
            },

            getNextTrackIndex(currentIndex) {
                if (!musicTracks.length) return null;
                if (musicTracks.length === 1) return 0;

                if (musicPlayMode === 'random') {
                    const candidates = musicTracks
                        .map((_, index) => index)
                        .filter((index) => index !== currentIndex);

                    if (!candidates.length) {
                        return currentIndex;
                    }

                    if (candidates.length === 1) {
                        return candidates[0];
                    }

                    let nextIndex = candidates[Math.floor(Math.random() * candidates.length)];
                    while (nextIndex === lastRandomIndex && candidates.length > 1) {
                        nextIndex = candidates[Math.floor(Math.random() * candidates.length)];
                    }
                    lastRandomIndex = nextIndex;
                    return nextIndex;
                }

                if (currentIndex >= musicTracks.length - 1) {
                    return 0;
                }
                return currentIndex + 1;
            },

            async advanceToNextTrack() {
                if (!musicTracks.length) {
                    this.stopPlayback();
                    return;
                }

                const nextIndex = this.getNextTrackIndex(this.currentIndex);
                if (nextIndex === null) {
                    this.stopPlayback();
                    return;
                }

                await this.playTrackAtIndex(nextIndex);
            },

            stopPlayback() {
                if (musicAudio) {
                    musicAudio.pause();
                    musicAudio.currentTime = 0;
                    musicAudio.src = '';
                }
                if (currentMusicObjectUrl && currentMusicObjectUrl.startsWith('blob:')) {
                    URL.revokeObjectURL(currentMusicObjectUrl);
                    currentMusicObjectUrl = '';
                }
                musicCurrentIndex = -1;
                this.currentIndex = -1;
                musicIsPlaying = false;
                updateMusicDisplay();
            },

            async handleAddedTracks(fileList) {
                if (!fileList || !fileList.length) {
                    return;
                }

                const validFiles = [];
                Array.from(fileList).forEach((file) => {
                    if (isSupportedMusicFile(file)) {
                        validFiles.push(file);
                    }
                });

                if (!validFiles.length) {
                    showStatus('対応していない音声形式です。mp3, wav, m4a, aac, ogg, webmのファイルを選択してください。', true);
                    return;
                }

                const preparedTracks = [];
                for (const file of validFiles) {
                    const data = await file.arrayBuffer();
                    preparedTracks.push({
                        id: generateTrackId(),
                        name: file.name,
                        data,
                        mimeType: file.type || 'audio/*',
                        size: file.size,
                        type: file.type || 'audio/*',
                        order: Date.now() + Math.random()
                    });
                }

                try {
                    await saveTracksToDatabase(preparedTracks);
                    musicTracks = [...musicTracks, ...preparedTracks].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
                    if (musicSelectedIndex < 0 || musicSelectedIndex >= musicTracks.length) {
                        musicSelectedIndex = 0;
                    }
                    updateMusicDisplay();
                    showStatus(`${preparedTracks.length}曲を追加しました。`);
                } catch (error) {
                    showStatus(error.message || '音楽の保存に失敗しました。容量や端末の制限を確認してください。', true);
                }
            },

            async removeTrack(trackId) {
                const targetIndex = musicTracks.findIndex((track) => track.id === trackId);
                if (targetIndex < 0) return;

                const track = musicTracks[targetIndex];
                if (track.objectUrl && track.objectUrl.startsWith('blob:')) {
                    URL.revokeObjectURL(track.objectUrl);
                }

                try {
                    await deleteTrackFromDatabase(trackId);
                    musicTracks = musicTracks.filter((trackItem) => trackItem.id !== trackId);

                    if (musicCurrentIndex === targetIndex) {
                        musicCurrentIndex = -1;
                        this.currentIndex = -1;
                        if (musicAudio) {
                            musicAudio.pause();
                            musicAudio.currentTime = 0;
                            musicAudio.src = '';
                        }
                    } else if (musicCurrentIndex > targetIndex) {
                        musicCurrentIndex -= 1;
                        this.currentIndex = musicCurrentIndex;
                    }

                    if (musicSelectedIndex === targetIndex) {
                        musicSelectedIndex = Math.min(targetIndex, Math.max(0, musicTracks.length - 1));
                    } else if (musicSelectedIndex > targetIndex) {
                        musicSelectedIndex -= 1;
                    }

                    if (musicSelectedIndex < 0) {
                        musicSelectedIndex = 0;
                    }

                    updateMusicDisplay();
                    showStatus('曲を削除しました。');
                } catch (error) {
                    showStatus(error.message || '曲の削除に失敗しました。', true);
                }
            }
        };

        function bindMusicControls() {
            const musicAddButton = document.getElementById('musicAddButton');
            const musicFileInput = document.getElementById('musicFileInput');
            const musicModeSelect = document.getElementById('musicModeSelect');
            const musicToggleButton = document.getElementById('musicToggleButton');
            const timerMusicToggleButton = document.getElementById('timerMusicToggleButton');

            musicAddButton.addEventListener('click', () => {
                musicFileInput.click();
            });

            musicFileInput.addEventListener('change', async (event) => {
                const files = event.target.files;
                if (!files || !files.length) {
                    return;
                }
                await musicController.handleAddedTracks(files);
                musicFileInput.value = '';
            });

            musicModeSelect.addEventListener('change', async (event) => {
                musicPlayMode = event.target.value;
                await storeMusicSettings('playMode', musicPlayMode);
                updateMusicDisplay();
            });

            musicToggleButton.addEventListener('click', () => {
                musicController.togglePlayback();
            });

            if (timerMusicToggleButton) {
                timerMusicToggleButton.addEventListener('click', () => {
                    musicController.togglePlayback();
                });
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            showSettingsScreen();
            bindMusicControls();
            musicController.initialize();

            window.addEventListener("keydown", (event) => {
                if (event.code !== 'Space') return;
                const timerScreen = document.getElementById("timerScreen");
                if (timerScreen.classList.contains("hidden")) return;
                event.preventDefault();
                togglePause();
            });
        });
    </script>

</body>
