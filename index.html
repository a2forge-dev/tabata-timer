<!DOCTYPE html>
<html lang="ja">

<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>タバタタイマー</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            background: #d32f2f;
            transition: .3s;
        }

        body.rest {
            background: #1976d2;
        }

        body.finish {
            background: #2e7d32;
        }

        #phase {
            font-size: 40px;
        }

        #timer {
            font-size: 120px;
            font-weight: bold;
        }

        #setInfo {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .settings {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .settings label {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: 16px;
            color: white;
        }

        .settings input {
            width: 90px;
            padding: 6px 8px;
            margin-top: 4px;
            font-size: 16px;
            border-radius: 4px;
            border: none;
            text-align: right;
        }

        button {
            font-size: 24px;
            padding: 15px 30px;
            margin: 10px;
        }

        #controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div id="settingsScreen">
        <div class="settings">
            <label>
                運動時間
                <input id="workTimeInput" type="number" min="1" step="1" value="20">
            </label>
            <label>
                休憩時間
                <input id="restTimeInput" type="number" min="1" step="1" value="10">
            </label>
            <label>
                セット数
                <input id="totalSetsInput" type="number" min="1" step="1" value="8">
            </label>
        </div>

        <div id="controls">
            <button id="startButton" onclick="startTimer()">開始</button>
        </div>
    </div>

    <div id="timerScreen" class="hidden">
        <div id="setInfo">セット 1 / 8</div>

        <div id="phase">運動</div>

        <div id="timer">20</div>

        <div id="controls">
            <button id="pauseButton" onclick="togglePause()">一時停止</button>
            <button id="timerResetButton" class="hidden" onclick="resetTimer()">リセット</button>
        </div>
    </div>

    <script>

        let workTime = 20;
        let restTime = 10;
        let totalSets = 8;

        let currentSet = 1;
        let currentTime = workTime;
        let isWork = true;
        let timerId = null;

        function beep(freq, duration) {

            const ctx =
                new (window.AudioContext ||
                    window.webkitAudioContext)();

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.frequency.value = freq;

            osc.connect(gain);
            gain.connect(ctx.destination);

            gain.gain.value = 0.2;

            osc.start();

            osc.stop(
                ctx.currentTime +
                duration / 1000
            );
        }

        function showSettingsScreen() {
            document.getElementById("settingsScreen").classList.remove("hidden");
            document.getElementById("timerScreen").classList.add("hidden");
        }

        function showTimerScreen() {
            document.getElementById("settingsScreen").classList.add("hidden");
            document.getElementById("timerScreen").classList.remove("hidden");
        }

        let isPaused = false;

        function togglePause() {
            if (timerId) {
                pauseTimer();
            } else {
                resumeTimer();
            }
        }

        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
            isPaused = true;
            document.getElementById("pauseButton").textContent = "再開";
            document.getElementById("timerResetButton").classList.remove("hidden");
        }

        function resumeTimer() {
            if (timerId) return;
            isPaused = false;
            document.getElementById("pauseButton").textContent = "一時停止";
            document.getElementById("timerResetButton").classList.add("hidden");
            startInterval();
        }

        async function startTimer() {
            if (timerId) return;

            applySettings();
            showTimerScreen();
            document.getElementById("pauseButton").textContent = "一時停止";
            document.getElementById("timerResetButton").classList.add("hidden");
            isPaused = false;

            startInterval();
        }

        async function startInterval() {
            if (timerId) return;

            if ('wakeLock' in navigator) {
                try {
                    await navigator.wakeLock.request('screen');
                } catch (e) { }
            }

            timerId = setInterval(() => {

                currentTime--;

                document.getElementById("timer")
                    .textContent = currentTime;

                if (
                    currentTime === 15 ||
                    currentTime === 14 ||
                    currentTime === 13
                ) {
                    beep(1200, 100);
                }

                if (currentTime <= 0) {

                    beep(700, 500);

                    if (isWork) {

                        isWork = false;
                        currentTime = restTime;

                        document.body.className = "rest";

                        document.getElementById("phase")
                            .textContent = "休憩";

                    } else {

                        currentSet++;

                        if (currentSet > totalSets) {

                            clearInterval(timerId);
                            timerId = null;
                            isPaused = false;
                            document.getElementById("pauseButton").classList.add("hidden");
                            document.getElementById("timerResetButton").classList.remove("hidden");

                            document.body.className = "finish";

                            document.getElementById("phase")
                                .textContent = "終了";

                            document.getElementById("timer")
                                .textContent = "0";

                            return;
                        }

                        isWork = true;
                        currentTime = workTime;

                        document.body.className = "";

                        document.getElementById("phase")
                            .textContent = "運動";

                        document.getElementById("setInfo")
                            .textContent =
                            `セット ${currentSet} / ${totalSets}`;
                    }

                    document.getElementById("timer")
                        .textContent = currentTime;
                }

            }, 1000);
        }

        function applySettings() {
            const newWork = parseInt(document.getElementById("workTimeInput").value, 10);
            const newRest = parseInt(document.getElementById("restTimeInput").value, 10);
            const newSets = parseInt(document.getElementById("totalSetsInput").value, 10);

            if (Number.isNaN(newWork) || newWork < 1) return;
            if (Number.isNaN(newRest) || newRest < 1) return;
            if (Number.isNaN(newSets) || newSets < 1) return;

            workTime = newWork;
            restTime = newRest;
            totalSets = newSets;

            currentSet = 1;
            currentTime = workTime;
            isWork = true;

            document.getElementById("phase").textContent = "運動";
            document.getElementById("timer").textContent = workTime;
            document.getElementById("setInfo").textContent = `セット ${currentSet} / ${totalSets}`;
        }

        function resetTimer() {

            clearInterval(timerId);

            timerId = null;
            isPaused = false;
            document.getElementById("pauseButton").classList.remove("hidden");
            document.getElementById("timerResetButton").classList.add("hidden");
            showSettingsScreen();
            document.getElementById("startButton").textContent = "開始";

            currentSet = 1;
            currentTime = workTime;
            isWork = true;

            document.body.className = "";

            document.getElementById("phase")
                .textContent = "運動";

            document.getElementById("timer")
                .textContent = workTime;

            document.getElementById("setInfo")
                .textContent = `セット ${currentSet} / ${totalSets}`;
        }

        document.getElementById("workTimeInput").addEventListener("change", applySettings);
        document.getElementById("restTimeInput").addEventListener("change", applySettings);
        document.getElementById("totalSetsInput").addEventListener("change", applySettings);

    </script>

</body>

</html>
